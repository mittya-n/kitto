<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kitto — Studio</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface-solid: #ffffff;
      --sub-surface: #f2f2f7;
      --border: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --muted: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --success: #34c759;
      --warn: #ff9f0a;
      --danger: #ff3b30;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      letter-spacing: -0.01em;
    }

    header {
      height: 52px;
      padding: 0 24px;
      background: rgba(245, 245, 247, 0.78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .brand span { font-size: 0.78rem; font-weight: 400; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 980px;
      padding: 7px 16px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    button.primary { background: var(--accent); color: #ffffff; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.01); }
    button.secondary { background: var(--sub-surface); color: var(--text); }
    button.secondary:hover:not(:disabled) { background: #e5e5ea; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    input, select, textarea {
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--sub-surface);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      background: var(--surface-solid);
      border-color: var(--accent);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.1fr 1.2fr;
      gap: 16px;
      padding: 16px 24px 24px;
      overflow: hidden;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }
    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; height: auto; overflow: visible; padding: 12px; }
      body { height: auto; }
    }

    .card {
      background: var(--surface-solid);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title { font-size: 0.92rem; font-weight: 600; color: var(--text); }
    .pill {
      font-size: 0.72rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 980px;
      background: var(--sub-surface);
      color: var(--muted);
      transition: all 0.2s;
    }
    .pill.active { background: rgba(0, 113, 227, 0.1); color: var(--accent); }
    .pill.warn { background: rgba(255, 159, 10, 0.14); color: #b25000; }
    .pill.danger { background: rgba(255, 59, 48, 0.12); color: var(--danger); }
    .pill.done { background: rgba(52, 199, 89, 0.12); color: #248a3d; }

    .card-body {
      flex: 1;
      padding: 8px 20px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* チャットバブル */
    .msg {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
      max-width: 86%;
      white-space: pre-wrap;
    }
    .msg.ceo {
      background: var(--sub-surface);
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      background: var(--accent);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.error {
      background: rgba(255, 59, 48, 0.08);
      color: var(--danger);
      border: 1px solid rgba(255, 59, 48, 0.2);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      font-size: 0.84rem;
    }

    /* タイピングインジケーター（思考中表示） */
    .typing-bubble {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      background: var(--sub-surface);
      color: var(--muted);
      font-size: 0.82rem;
      align-self: flex-start;
    }
    .dots { display: inline-flex; gap: 4px; }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.3s infinite ease-in-out both;
    }
    .dots span:nth-child(1) { animation-delay: -0.32s; }
    .dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .composer {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface-solid);
    }
    .composer-row { display: flex; gap: 8px; align-items: flex-end; }
    .composer-row textarea {
      flex: 1;
      resize: none;
      height: 44px;
      max-height: 120px;
      border-radius: 20px;
      padding: 11px 16px;
      line-height: 1.4;
    }
    .send-icon-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .log-entry {
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bg);
      font-size: 0.84rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .log-head {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .log-head.accent { color: var(--accent); }
    .log-head.warn { color: #b25000; }
    .log-head.danger { color: var(--danger); }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    .toolbar { display: flex; gap: 6px; align-items: center; }
    .toolbar button { padding: 5px 12px; font-size: 0.78rem; }
    iframe {
      width: 100%;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      min-height: 380px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal {
      background: var(--surface-solid);
      width: 90%;
      max-width: 400px;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal h3 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
  </style>
</head>
<body>

<header>
  <div class="brand">kitto <span>Studio</span></div>
  <div class="header-actions">
    <span id="keyStatus" style="font-size: 0.78rem; color: var(--muted);"></span>
    <button class="secondary" onclick="openSettings()">設定</button>
  </div>
</header>

<main>
  <!-- 1. 要件定義 -->
  <section class="card">
    <div class="card-header">
      <span class="card-title">要件定義</span>
      <span class="pill active" id="phaseBadge">対話中</span>
    </div>
    <div class="card-body" id="chatBox">
      <div class="msg ceo">今日は何を作りますか？</div>
    </div>
    <div class="composer">
      <div class="composer-row">
        <textarea id="userInput" placeholder="作りたいものを入力..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendHearing();}"></textarea>
        <button class="primary send-icon-btn" id="sendBtn" onclick="sendHearing()" title="送信">↑</button>
      </div>
      <button class="primary" id="launchBtn" onclick="startProject()" disabled style="width: 100%; padding: 10px;">開発を開始する</button>
    </div>
  </section>

  <!-- 2. 開発プロセス -->
  <section class="card">
    <div class="card-header">
      <span class="card-title">プロセス</span>
      <span class="pill" id="statusBadge">待機中</span>
    </div>
    <div class="card-body" id="officeLogs">
      <div class="empty-state">要件が確定すると進行します</div>
    </div>
  </section>

  <!-- 3. アウトプット -->
  <section class="card">
    <div class="card-header">
      <span class="card-title">アウトプット</span>
      <div class="toolbar">
        <button class="secondary" onclick="showTab('preview')">プレビュー</button>
        <button class="secondary" onclick="showTab('spec')">仕様書</button>
        <button class="primary" id="dlHtmlBtn" onclick="downloadFile('html')" disabled>保存</button>
        <button class="secondary" id="dlMdBtn" onclick="downloadFile('md')" disabled>MD</button>
      </div>
    </div>
    <div class="card-body" id="deliveryBox">
      <div id="previewArea" style="display:flex; flex-direction:column; flex:1;">
        <div class="empty-state">完成したプロダクトがここに表示されます</div>
      </div>
      <div id="specArea" style="display:none; white-space:pre-wrap; font-size:0.84rem; line-height:1.6;"></div>
    </div>
  </section>
</main>

<!-- 設定モーダル -->
<div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this) closeSettings()">
  <div class="modal">
    <h3>環境設定</h3>
    <div class="field">
      <label>Gemini API キー</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
    </div>
    <div style="font-size:0.78rem; color:var(--muted); line-height:1.5;">
      最適なモデルはタスク（対話・設計・実装）に応じてシステムが自動選択します。
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
      <button class="secondary" onclick="closeSettings()">キャンセル</button>
      <button class="primary" onclick="saveKey()">完了</button>
    </div>
  </div>
</div>

<script>
  const apiKeyInput = document.getElementById("apiKeyInput");
  const keyStatus = document.getElementById("keyStatus");
  apiKeyInput.value = localStorage.getItem("kitto_gemini_key") || "";

  let fastModels = [];
  let smartModels = [];

  async function initAutoModels() {
    const key = (localStorage.getItem("kitto_gemini_key") || "").trim();
    if (!key) {
      keyStatus.textContent = "APIキー未設定";
      return;
    }
    keyStatus.textContent = "準備中...";
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
      if (!res.ok) {
        keyStatus.textContent = "キーエラー";
        return;
      }
      const data = await res.json();
      const valid = (data.models || [])
        .filter(m =>
          m.supportedGenerationMethods?.includes("generateContent") &&
          m.name.includes("gemini") &&
          !/embedding|imagen|veo|tts|audio|robotics|computer|vision|aqa|bisect|custom/i.test(m.name)
        )
        .map(m => m.name.replace("models/", ""));

      const scoreFast = (name) => {
        let s = 0;
        if (name.includes("flash-lite")) s += 50;
        else if (name.includes("flash")) s += 40;
        if (name.includes("2.5") || name.includes("3.")) s += 20;
        if (name.includes("latest")) s += 15;
        if (name.includes("preview") || name.includes("exp")) s -= 10;
        return s;
      };
      const scoreSmart = (name) => {
        let s = 0;
        if (name.includes("pro")) s += 50;
        else if (name.includes("flash") && !name.includes("lite")) s += 40;
        if (name.includes("2.5") || name.includes("3.")) s += 20;
        if (name.includes("latest")) s += 15;
        if (name.includes("preview") || name.includes("exp")) s -= 5;
        return s;
      };

      fastModels = [...valid].sort((a, b) => scoreFast(b) - scoreFast(a));
      smartModels = [...valid].sort((a, b) => scoreSmart(b) - scoreSmart(a));

      keyStatus.textContent = fastModels.length > 0 ? "Auto Ready" : "モデルなし";
    } catch (e) {
      keyStatus.textContent = "オフライン";
    }
  }

  function openSettings() { document.getElementById("settingsModal").style.display = "flex"; }
  function closeSettings() { document.getElementById("settingsModal").style.display = "none"; }
  async function saveKey() {
    localStorage.setItem("kitto_gemini_key", apiKeyInput.value.trim());
    closeSettings();
    await initAutoModels();
  }

  initAutoModels();

  let hearingHistory = [];
  let finalizedSpecPrompt = "";
  let generatedHtml = "";
  let generatedMd = "";

  function setPhaseBadge(text, type = "active") {
    const b = document.getElementById("phaseBadge");
    b.textContent = text;
    b.className = "pill " + type;
  }

  function addChat(role, text) {
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function showThinkingBubble(initialText = "思考中...") {
    removeThinkingBubble();
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.id = "thinkingBubble";
    div.className = "typing-bubble";
    div.innerHTML = `<div class="dots"><span></span><span></span><span></span></div><span id="thinkingLabel">${initialText}</span>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function updateThinkingBubble(text) {
    const label = document.getElementById("thinkingLabel");
    if (label) label.textContent = text;
  }

  function removeThinkingBubble() {
    const el = document.getElementById("thinkingBubble");
    if (el) el.remove();
  }

  function addLog(title, body, tone = "") {
    const box = document.getElementById("officeLogs");
    if (box.querySelector(".empty-state")) box.innerHTML = "";
    const div = document.createElement("div");
    div.className = "log-entry";
    div.innerHTML = `<div class="log-head ${tone}"><span>${escapeHtml(title)}</span></div>${escapeHtml(body)}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function callGemini(prompt, jsonMode = false, onStatus = null, mode = "smart") {
    const key = (localStorage.getItem("kitto_gemini_key") || "").trim();
    if (!key) {
      openSettings();
      throw new Error("先に右上の「設定」からAPIキーを登録してください。");
    }
    if (fastModels.length === 0) await initAutoModels();

    const candidates = (mode === "fast" ? fastModels : smartModels).slice(0, 4);
    if (candidates.length === 0) {
      throw new Error("利用可能なモデルが見つかりませんでした。APIキーの権限を確認してください。");
    }

    const timeoutMs = mode === "fast" ? 15000 : 45000;
    let lastError = "";

    for (let i = 0; i < candidates.length; i++) {
      const model = candidates[i];
      if (i > 0 && onStatus) {
        onStatus(`別モデル (${model}) に自動切替中...`);
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
      const body = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: jsonMode ? { responseMimeType: "application/json" } : {}
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) return text;
        } else {
          const errText = await res.text();
          lastError = `${model}: ${res.status} ${errText.slice(0, 80)}`;
        }
      } catch (e) {
        clearTimeout(timeoutId);
        lastError = `${model}: 応答タイムアウト`;
      }
    }
    throw new Error(`全候補モデルで応答を得られませんでした（詳細: ${lastError}）`);
  }

  async function sendHearing() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addChat("user", text);
    hearingHistory.push(`クライアント: ${text}`);

    const btn = document.getElementById("sendBtn");
    btn.disabled = true;
    setPhaseBadge("応答待ち", "active");

    let sec = 0;
    showThinkingBubble("応答待ち... (0秒)");
    const timer = setInterval(() => {
      sec++;
      updateThinkingBubble(`応答待ち... (${sec}秒)`);
    }, 1000);

    try {
      const prompt = `あなたは開発スタジオ「kitto」のディレクターです。
挨拶や自己紹介は一切省き、簡潔な日本語でクライアントの要件を深掘りしてください。

これまでの会話：
${hearingHistory.join("\n")}

指示：
1. 本質的な確認事項（「誰が使うか」「一番重視する体験」「避けたい挙動」など）を2点だけ短く質問してください。
2. 十分な情報が揃ったら、「要件が固まりました。下の『開発を開始する』から進められます。」と伝え、最後に [READY] とだけ付けてください。`;

      const replyText = await callGemini(prompt, false, (msg) => {
        updateThinkingBubble(msg);
      }, "fast");

      clearInterval(timer);
      removeThinkingBubble();

      const isReady = replyText.includes("[READY]");
      const cleanReply = replyText.replace("[READY]", "").trim();

      addChat("ceo", cleanReply);
      hearingHistory.push(`ディレクター: ${cleanReply}`);
      finalizedSpecPrompt = hearingHistory.join("\n");

      document.getElementById("launchBtn").disabled = false;
      if (isReady) {
        setPhaseBadge("要件確定", "done");
      } else {
        setPhaseBadge("対話中", "active");
      }
    } catch (e) {
      clearInterval(timer);
      removeThinkingBubble();
      setPhaseBadge("エラー", "danger");
      addChat("error", "⚠️ " + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function startProject() {
    const launchBtn = document.getElementById("launchBtn");
    const statusBadge = document.getElementById("statusBadge");
    launchBtn.disabled = true;
    document.getElementById("officeLogs").innerHTML = "";
    statusBadge.textContent = "進行中";
    statusBadge.className = "pill active";

    const logRetry = (msg) => {
      statusBadge.textContent = "切替中";
      statusBadge.className = "pill warn";
      addLog("モデル自動調整", msg, "warn");
    };

    try {
      addLog("チーム編成", "要件に最適なスペシャリスト3名を選出しています...", "accent");
      const hirePrompt = `あなたは開発スタジオ「kitto」の統括です。以下の要件に対して、コンセプトと専門社員3名（うち1名はフロントエンド・AI実装エンジニア）を定義してください。
【要件】
${finalizedSpecPrompt}

JSON形式のみで出力：
{
  "project_vision": "一言で表すコアコンセプト",
  "success_criteria": ["基準1", "基準2", "基準3"],
  "employees": [
    {"name": "氏名", "role": "役職", "personality": "思考スタイル", "mission": "担当領域"}
  ]
}`;
      const plan = JSON.parse(await callGemini(hirePrompt, true, logRetry, "smart"));
      let teamSummary = `コンセプト：${plan.project_vision}\n\n`;
      plan.employees.forEach(e => {
        teamSummary += `・${e.name}（${e.role}）— ${e.mission}\n`;
      });
      addLog("編成完了", teamSummary.trim());

      let unifiedSpec = "";
      let feedback = "";
      let allLogs = [`# kitto 仕様書\n\n## コンセプト\n${plan.project_vision}\n`];

      for (let round = 1; round <= 2; round++) {
        statusBadge.textContent = `Round ${round}`;
        statusBadge.className = "pill active";
        let drafts = [];
        for (const emp of plan.employees) {
          addLog(`${emp.name}（${emp.role}）`, "設計案を作成中...");
          const empPrompt = `あなたは「${emp.role}」の「${emp.name}」（${emp.personality}）です。
担当：${emp.mission} / コンセプト：${plan.project_vision}
要件：${finalizedSpecPrompt}
${feedback ? `【監査指摘】\n${feedback}\n【現行仕様】\n${unifiedSpec}\n指摘を反映した改善案を出してください。` : "専門視点から具体的な設計案を提案してください。"}`;
          const res = await callGemini(empPrompt, false, logRetry, "smart");
          drafts.push(`### ${emp.name}（${emp.role}）\n${res}`);
        }

        addLog("仕様統合", "3名の設計案をすり合わせ、統一仕様書に統合しています...", "accent");
        const meetingPrompt = `以下の3名の案を議論・統合し、矛盾のない「完全統一システム仕様書」を作成してください。
メンバー：${plan.employees.map(e => `\${e.name}(${e.role})`).join(" / ")} 各案： ${drafts.join("\n\n")} ${feedback ? `解決すべき指摘：${feedback}` : ""}

「## 第1部：レビュー議論」と「## 第2部：完全統一システム仕様書（JSONスキーマ・対話規則・状態遷移・UI設計）」の2部構成で出力してください。`;
        unifiedSpec = await callGemini(meetingPrompt, false, logRetry, "smart");
        addLog(`Round ${round} 仕様統合完了`, unifiedSpec.slice(0, 450) + "\n...");
        allLogs.push(`## Round ${round}\n\n${unifiedSpec}`);

        addLog("品質監査", "監査役Renが仕様の完成度を審査しています...", "warn");
        const auditPrompt = `あなたは監査役「Ren」です。以下の仕様書を100点満点で厳格に採点し、85点以上なら合格にしてください。
基準：${plan.success_criteria.join(" / ")}
仕様書：
${unifiedSpec}

JSON形式のみで出力：
{"score": 数値, "is_approved": true/false, "critique": "講評", "revision_instructions": "修正指示"}`;
        const audit = JSON.parse(await callGemini(auditPrompt, true, logRetry, "smart"));
        addLog(`監査結果：${audit.score}点（${audit.is_approved ? "承認" : "差し戻し"}）`, `${audit.critique}${audit.is_approved ? "" : "\n修正指示：" + audit.revision_instructions}`, audit.is_approved ? "accent" : "danger");

        if (audit.is_approved) break;
        feedback = audit.revision_instructions;
      }

      statusBadge.textContent = "ビルド中";
      statusBadge.className = "pill active";
      addLog("実装フェーズ", "承認された仕様からアプリケーションを生成しています...", "accent");
      const buildPrompt = `あなたはリードエンジニアです。以下の完全統一仕様書をもとに、ブラウザで動作するWebアプリをHTML/CSS/JavaScriptの単一ファイルとして実装してください。
【要件】
1. ユーザーが自分のGemini APIキーを入力（localStorage保存）し、実際にGemini APIと対話・機能利用できること。
2. 仕様書で定義された状態管理（ステートパネル等）や寄り添いロジックが画面上で視覚的に動くこと。
3. Appleの製品のように余白を活かしたミニマルで洗練されたUIデザインにすること。

完全統一仕様書：
${unifiedSpec}

説明文は一切書かず、<!DOCTYPE html> から </html> までの完全なHTMLコードのみを出力してください。`;
      let htmlOut = await callGemini(buildPrompt, false, logRetry, "smart");
      htmlOut = htmlOut.replace(/^```html\s*/i, "").replace(/^```\s*/i, "").replace(/```\s*$/i, "").trim();

      generatedHtml = htmlOut;
      generatedMd = allLogs.join("\n\n---\n\n");

      document.getElementById("specArea").textContent = generatedMd;
      const previewArea = document.getElementById("previewArea");
      previewArea.innerHTML = "";
      const iframe = document.createElement("iframe");
      iframe.srcdoc = generatedHtml;
      previewArea.appendChild(iframe);

      document.getElementById("dlHtmlBtn").disabled = false;
      document.getElementById("dlMdBtn").disabled = false;
      statusBadge.textContent = "完了";
      statusBadge.className = "pill done";
      addLog("完了", "アウトプットにプロダクトを納品しました。", "accent");

    } catch (e) {
      addLog("エラー停止", e.message, "danger");
      statusBadge.textContent = "エラー";
      statusBadge.className = "pill danger";
    } finally {
      launchBtn.disabled = false;
    }
  }

  function showTab(type) {
    document.getElementById("previewArea").style.display = type === "preview" ? "flex" : "none";
    document.getElementById("specArea").style.display = type === "spec" ? "block" : "none";
  }

  function downloadFile(type) {
    const content = type === "html" ? generatedHtml : generatedMd;
    const filename = type === "html" ? "kitto_app.html" : "kitto_spec.md";
    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }
</script>
</body>
</html>
